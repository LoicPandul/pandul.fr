trades:
  title: "Ce que je fais"
  lead: "Bitcoin m'a accroché en 2020, par sa technique, sa monnaie et sa philosophie. En 2021, Bitstack m'a confié son blog, puis d'autres clients ont suivi."
  index_label: "Mes trois métiers"
  index:
    - "Rédaction"
    - "Documentation"
    - "Développement"
  hint_fine: "Passez la souris sur la page&nbsp;: ses traits redeviennent des mots."
  hint_touch: "Touchez une ligne de la page pour la lire."
  write_title: "Rédaction et pédagogie"
  write_body: "Articles, tutoriels, formations complètes, scripts de vidéos et de podcasts. Je pars de zéro et j'avance marche par marche, avec des exemples concrets, sans rien supposer d'évident."
  fig_ecrits: "tutoriels, articles et documentations"
  fig_formations: "formations complètes"
  fig_audio: "podcasts, vidéos et interviews"
  courses_intro: "Mes formations sur Plan ₿ Academy&nbsp;:"
  docs_title: "Documentation technique"
  docs_body: "Guides d'installation, références de SDK, notes de version. Je lis le code source avant d'écrire, et je teste chaque commande pour qu'elle fonctionne du premier coup chez le lecteur."
  docs_now: "En ce moment, je m'occupe de la documentation de Bark chez Second, et de celle du portefeuille Liana chez Wizardsardine."
  docs_alt: "Page d'accueil de la documentation de Bark Pay sur le site de Second"
  docs_caption: "La documentation de Bark Pay, sur le site de Second."
  dev_title: "Développement assisté par&nbsp;l'IA"
  dev_body: "Je vibe code des logiciels Bitcoin open source&nbsp;: je les conçois, puis je les code avec l'IA. C'est comme ça que j'ai construit <a class=\"link\" href=\"https://gerfaut-wallet.com\">Gerfaut</a>, un portefeuille watch-only pour Android, Linux, macOS et Windows."
  dev_sign: "Chaque version que je publie est signée avec ma clé minisign. Vous pouvez donc vérifier vous-même que le fichier téléchargé vient bien de moi."
  also_title: "Et aussi"
  also: "Je fais aussi de la relecture technique et du fact-checking, je conçois des parcours de formation et je tiens la ligne éditoriale d'un blog. Je livre en Markdown sur GitHub, dans Google Docs ou directement dans votre CMS."

projects:
  title: "Projets"
  lead: "En dehors de mes clients, je construis mes propres outils, gratuits et open source."
  dict_as: "comme"
  dict_body: "Plus de 1&nbsp;400 définitions du vocabulaire technique de Bitcoin, de l'adresse de réception au zero-knowledge proof. Le dictionnaire est open source, gratuit en ligne et publié sous licence <span class=\"nowrap\">CC BY-NC-SA 4.0</span>."
  dict_read: "Lire la définition complète"
  dict_next: "Une autre définition"
  dict_open: "Ouvrir le dictionnaire"
  dict_book: "Il existe aussi en livre imprimé, sur <a class=\"link\" href=\"https://bitcoinbazar.fr/products/le-dictionnaire-de-bitcoin\" rel=\"noopener\">Bitcoin Bazar</a> et sur <a class=\"link\" href=\"https://amzn.to/4cxaOA8\" rel=\"noopener\">Amazon</a>."
  gerfaut_body: "Un portefeuille Bitcoin watch-only, gratuit et open source, pour Android, Linux, macOS et Windows. Gerfaut suit vos portefeuilles à partir de leur descripteur ou de leur clé publique, et vous prévient dès que des fonds bougent. Il ne détient jamais aucune clé privée."
  gerfaut_beta: "En bêta publique."
  gerfaut_open: "Découvrir Gerfaut"
  gerfaut_facts_label: "Ce que fait Gerfaut"
  gerfaut_facts:
    - "Il lit les descripteurs, les xpub, les adresses seules, les multisig et Miniscript."
    - "Il passe par votre propre nœud, Electrum ou Esplora, avec Tor intégré."
    - "Une seule sauvegarde chiffrée pour l'ordinateur et le téléphone."
    - "Sur Android&nbsp;: widgets, notifications en direct et mode discret."
  gerfaut_desk_alt: "Gerfaut sur ordinateur, écran « Broadcast » : une transaction prête à être diffusée, avec le schéma de ses entrées et de ses sorties"
  gerfaut_phone_alt: "Gerfaut sur Android : la liste des portefeuilles surveillés et leurs soldes"
  gerfaut_caption_wide: "Gerfaut sur ordinateur&nbsp;: diffuser une transaction signée ailleurs et la suivre jusqu'à sa confirmation. "
  gerfaut_caption: "Sur Android&nbsp;: les portefeuilles surveillés et leurs soldes."

