trades:
  title: "Ce que je fais"
  index_label: "Mes trois métiers"
  index:
    - "Rédaction"
    - "Documentation"
    - "Développement"
  write_title: "Rédaction et pédagogie"
  write_body: "Articles de blog, tutoriels, formations complètes, scripts de vidéos et de podcasts, relecture technique et fact-checking. Je conçois aussi des parcours de formation, et je peux tenir la ligne éditoriale de votre blog."
  write_gain: "En me confiant vos contenus, vous profitez de mon expertise sur Bitcoin et de ma réputation. Concrètement, ces contenus attirent de nouveaux utilisateurs, les forment à votre produit, renforcent votre crédibilité, nourrissent votre référencement et réduisent les questions qui arrivent à votre support."
  write_tools: "Je m'adapte à vos outils et à votre organisation, sans vous imposer les miens."
  fig_ecrits: "tutoriels, articles et docs"
  fig_formations: "formations complètes"
  fig_audio: "podcasts, vidéos et interviews"
  courses_intro: "Mes formations sur Plan ₿ Academy&nbsp;:"
  docs_title: "Documentation technique"
  docs_body: "Je crée et je maintiens des documentations modernes, au niveau des meilleures startups&nbsp;: guides de démarrage, références d'API et de SDK, notes de version. Je travaille sur Mintlify et sur Fumadocs, et je connais les codes du genre&nbsp;: une page par tâche, une navigation claire, des commandes testées qui marchent du premier coup."
  docs_llm: "Votre documentation est aussi pensée pour l'ère des LLM&nbsp;: chaque page existe en Markdown, avec un index llms.txt, pour que ChatGPT, Claude ou l'assistant de votre doc répondent juste à vos utilisateurs. Résultat&nbsp;: les développeurs intègrent votre produit plus vite, et votre support reçoit moins de tickets."
  docs_alt: "Page d'accueil de la documentation de Bark Pay sur le site de Second"
  docs_caption: "La documentation de Bark Pay, sur le site de Second."
  dev_title: "Développement"
  dev_body: "Je vibe code des logiciels Bitcoin open source. J'ai créé <a class=\"link\" href=\"https://gerfaut-wallet.com\">Gerfaut</a>, le meilleur portefeuille watch-only, pour Android, Linux, macOS et Windows. J'ai aussi créé <a class=\"link\" href=\"https://github.com/LoicPandul/SatConverter\">SatConverter</a>, un petit logiciel de bureau pratique qui convertit les sats, les BTC, les euros et les dollars au cours du moment."

