  dev_body: "I vibe code open source Bitcoin software: I design it, then I build it with AI. That is how I made <a class=\"link\" href=\"https://gerfaut-wallet.com\">Gerfaut</a>, a watch-only wallet for Android, Linux, macOS and Windows."
  dev_sign: "Every release I publish is signed with my minisign key. So you can check for yourself that the file you downloaded really comes from me."
  also_title: "Also"
  also: "I also do technical proofreading and fact-checking, design learning paths and run the editorial line of a blog. I deliver in Markdown on GitHub, in Google Docs or straight into your CMS."

projects:
