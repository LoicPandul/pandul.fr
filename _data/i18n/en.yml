  write_title: "Writing and teaching"
  write_body: "Blog articles, tutorials, full courses, video and podcast scripts, technical proofreading and fact-checking. I also design learning paths, and I can run the editorial line of your blog."
  write_gain: "When you hand me your content, you get my Bitcoin expertise and my reputation. In practice, this content brings in new users, teaches them your product, builds your credibility, improves your search ranking and cuts down the questions that reach your support team."
  write_tools: "I adapt to your tools and the way your team works, without forcing mine on you."
  fig_ecrits: "tutorials, articles and docs"
  fig_formations: "full courses"
  fig_audio: "podcasts, videos and interviews"
  courses_intro: "My courses on Plan ₿ Academy (in French):"
  docs_title: "Technical documentation"
  docs_body: "I build and maintain modern documentation, on par with the best startups: quickstarts, API and SDK references, release notes. I work with Mintlify and Fumadocs, and I know the conventions of the genre: one page per task, clear navigation, tested commands that work the first time."
  docs_llm: "Your docs are also built for the LLM era: every page exists in Markdown, with an llms.txt index, so that ChatGPT, Claude or your docs assistant can give your users the right answer. The result: developers integrate your product faster, and your support team gets fewer tickets."
  docs_alt: "Home page of the Bark Pay documentation on Second's website"
  docs_caption: "The Bark Pay documentation, on Second's website."
  dev_title: "Development"
  dev_body: "I vibe code open source Bitcoin software. I created <a class=\"link\" href=\"https://gerfaut-wallet.com\">Gerfaut</a>, the best watch-only wallet, for Android, Linux, macOS and Windows. I also created <a class=\"link\" href=\"https://github.com/LoicPandul/SatConverter\">SatConverter</a>, a small and handy desktop tool that converts between sats, BTC, euros and dollars at the current price."

