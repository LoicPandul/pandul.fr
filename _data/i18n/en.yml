  docs_now: "Right now, I look after the Bark documentation at Second, and the Liana wallet documentation at Wizardsardine."
  docs_alt: "Home page of the Bark Pay documentation on Second's website"
  docs_caption: "The Bark Pay documentation, on Second's website."
