  lead: "Outside client work, I build my own tools, free and open source."
  dict_as: "as in"
  dict_body: "A Bitcoin dictionary in French: over 1,400 definitions of Bitcoin's technical vocabulary, from the receiving address to the zero-knowledge proof. The dictionary is open source, free to read online and published under the <span class=\"nowrap\">CC BY-NC-SA 4.0</span> licence."
  dict_read: "Read the full definition"
  dict_next: "Another definition"
  dict_open: "Open the dictionary"
  dict_book: "It also comes as a printed book, from <a class=\"link\" href=\"https://bitcoinbazar.fr/products/le-dictionnaire-de-bitcoin\" rel=\"noopener\">Bitcoin Bazar</a> and <a class=\"link\" href=\"https://amzn.to/4cxaOA8\" rel=\"noopener\">Amazon</a>."
  gerfaut_body: "A free and open source watch-only Bitcoin wallet for Android, Linux, macOS and Windows. Gerfaut follows your wallets from their descriptor or their public key, and tells you as soon as funds move. It never holds a single private key."
  gerfaut_beta: "In public beta."
  gerfaut_open: "Discover Gerfaut"
  gerfaut_facts_label: "What Gerfaut does"
  gerfaut_facts:
    - "It reads descriptors, xpubs, single addresses, multisig and Miniscript."
    - "It connects through your own node, Electrum or Esplora, with Tor built in."
    - "One encrypted backup for both your computer and your phone."
    - "On Android: widgets, live notifications and a discreet mode."
  gerfaut_desk_alt: "Gerfaut on desktop, Broadcast screen: a transaction ready to be broadcast, with a diagram of its inputs and outputs"
