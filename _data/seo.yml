# _data/seo.yml : données consommées par _includes/seo/ (JSON-LD et balises Open Graph).

# Organisation (Pandul) - D-04
organization:
  type: "Organization"
  id: "https://pandul.fr/#organization"
  name: "Pandul"
  legal_name: "Ei Loïc Morel"
  url: "https://pandul.fr/"
  logo: "https://pandul.fr/assets/img/social-card.png"
  founding_date: "2021"
  founder_ref: "https://pandul.fr/#person-loic"  # reference Person par @id
  same_as:
    - "https://x.com/Loic_Pandul"
    - "https://github.com/LoicPandul"

# Person (Loïc Morel)
person:
  type: "Person"
  id: "https://pandul.fr/#person-loic"
  name: "Loïc Morel"
  alternate_name: "Pandul"
  url: "https://pandul.fr/"
  image: "https://pandul.fr/assets/img/v3/loic-morel-carre.webp"
  job_title: "Rédacteur technique spécialisé sur Bitcoin"
  knows_about:
    - "Bitcoin"
    - "Lightning Network"
    - "Cryptographie"
    - "Confidentialité numérique"
    - "Documentation technique"
    - "Développement logiciel"
  same_as:
    - "https://x.com/Loic_Pandul"
    - "https://github.com/LoicPandul"
    - "https://www.amazon.fr/stores/Loïc-Morel/author/B0GX5ZYL9F"
  works_for_ref: "https://pandul.fr/#organization"

# Open Graph defaults - D-05
og:
  default_image: "/assets/img/social-card.png"
  default_image_width: 1200
  default_image_height: 630
  default_image_alt: "Loïc Morel, rédacteur technique spécialisé sur Bitcoin"
  default_image_alt_en: "Loïc Morel, technical writer focused on Bitcoin"
  default_locale: "fr_FR"
  site_name: "Pandul"

# WebSite (Phase 15 GE-02)
website:
  type: "WebSite"
  id: "https://pandul.fr/#website"
  url: "https://pandul.fr/"
  name: "Pandul"
  in_language: "fr"
  publisher_ref: "https://pandul.fr/#organization"

# Keywords site-wide (informationnel, peu utilise par moteurs modernes mais utile pour audit)
keywords:
  - "Bitcoin"
  - "pédagogie Bitcoin"
  - "Lightning Network"
  - "Loïc Morel"
  - "Pandul"
