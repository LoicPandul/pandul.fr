title: "Loïc Morel - Pandul"
description: "Loïc Morel, rédacteur technique spécialisé sur Bitcoin et développeur : tutoriels, formations, documentation et logiciels Bitcoin."
author:
  name: "Loïc Morel"
  twitter: "Loic_Pandul"
  url: "https://pandul.fr/"
lang: fr
timezone: Europe/Paris

# URL GitHub
url: "https://pandul.fr"
baseurl: ""

permalink: pretty

# Kramdown - proteger le contenu LaTeX ($$ delimiteurs)
kramdown:
  math_engine: mathjax
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - ".well-known"

exclude:
  - "CLAUDE.md"
  - "README.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "_scripts/"
  - ".githooks/"
  - "design/"

# Cloudflare Web Analytics (D-09 - token public by design, OK to commit)
analytics:
  cloudflare_token: "48df3ac9740c4498836e138fc869e5f1"

# Twitter Card (jekyll-seo-tag - D-02, ST-04)
twitter:
  username: "Loic_Pandul"
  card: "summary_large_image"

# Image globale par defaut (Open Graph fallback - D-05)
image: "/assets/img/social-card.png"

# Webmaster verifications (D-02, ST-04)
# GSC : verification via Domain property DNS TXT (Cloudflare), auto-propagation a la propriete URL-prefix https://pandul.fr/
# Bing : skipped Cas C (Plan 14-03b 2026-05-17) - a re-evaluer v1.3+ si besoin
# Bloc conserve pour future utilisation - empty strings = jekyll-seo-tag n'emet pas les meta tags
webmaster_verifications:
  google: ""
  bing: ""

# Metadonnees SEO
logo: "/assets/img/social-card.png"
social:
  name: "Loïc Morel - Pandul"
  links:
    - "https://x.com/Loic_Pandul"
    - "https://github.com/LoicPandul"

# Le Dictionnaire de Bitcoin vit sur son propre domaine.
# Seule source de son adresse : les redirections et les liens du site la lisent ici.
# Sans barre oblique finale.
dictionnaire_url: "https://dictionnaire-bitcoin.com"

# Anciennes URL /dictionnaire/... : une page de redirection par URL (_redirections/),
# vers le même chemin sur dictionnaire_url, sans le préfixe /dictionnaire.
collections:
  redirections:
    output: true
    permalink: /dictionnaire/:path/

defaults:
  - scope: {path: ""}
    values:
      layout: "default"
  - scope:
      type: redirections
    values:
      layout: "redirection-dictionnaire"
      sitemap: false
