{%- comment -%}
  Un seul <script type="application/ld+json"> par page, en @graph :
  WebSite, Organization (Pandul) et Person (Loïc Morel), avec des @id stables.
{%- endcomment -%}
{%- capture jsonld_website -%}{%- include seo/jsonld-website.html -%}{%- endcapture -%}
{%- capture jsonld_organization -%}{%- include seo/jsonld-organization.html -%}{%- endcapture -%}
{%- capture jsonld_person -%}{%- include seo/jsonld-person.html -%}{%- endcapture -%}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[{{ jsonld_website }},{{ jsonld_organization }},{{ jsonld_person }}]}
</script>
