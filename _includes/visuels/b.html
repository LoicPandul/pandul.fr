{%- comment -%} Visuel d'accueil B, « pile » : les six formations en pile de cartes ; la carte du dessus passe derrière
toutes les 3,2 s (site.js, initVisuels), le survol ou le bouton Pause arrêtent la pile. {%- endcomment %}
  <figure class="hero-stage visuel visuel-b" data-visuel="b">
    <div class="stage-box vb-box">
      <ul class="vb-deck" data-deck>
        {%- for f in site.data.formations %}
        {%- assign code = f.code | downcase | remove: " " %}
        <li class="vb-card" style="--k:{{ forloop.index0 }}">
          <a class="card vb-link" href="{{ f.url }}" rel="noopener">
            <img src="{{ '/assets/img/pbn-' | append: code | append: '-thumbnail.webp' | relative_url }}" alt="" width="720" height="405" decoding="async"{% unless forloop.first %} loading="lazy"{% endunless %}>
            <span class="vb-text"><span class="badge">{{ f.code }}</span> <span class="vb-title"{% if en %} lang="fr"{% endif %}>{{ f.title }}</span></span>
          </a>
        </li>
        {%- endfor %}
      </ul>
    </div>
    <figcaption class="stage-caption vb-caption">
      <span>{{ t.hero.vb_caption }}</span>
      <span class="vb-ctrl" data-deck-ctrl hidden>
        <button class="btn btn-secondary btn-sm" type="button" data-deck-next>{{ t.hero.vb_next }}</button>
        <button class="btn btn-secondary btn-sm" type="button" data-deck-pause data-play="{{ t.hero.play }}" data-pause="{{ t.hero.pause }}">{{ t.hero.pause }}</button>
      </span>
    </figcaption>
  </figure>
